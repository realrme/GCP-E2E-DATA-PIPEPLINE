x-airflow-common:
  &airflow-common
  image: apache/airflow:${AIRFLOW_IMAGE_TAG:-2.7.1}
  env_file:
    - .env
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
    - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - GOOGLE_APPLICATION_CREDENTIALS=/home/airflow/.config/gcloud/application_default_credentials.json
    - GCLOUD_PROJECT=${GCP_PROJECT_ID}
    - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    - BQ_DATASET_BRONZE=${BQ_DATASET_BRONZE:-bronze_transactions}
    - POSTGRES_HOST=postgres_source
    - POSTGRES_PORT=5432
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
    - POSTGRES_DB=${POSTGRES_DB:-transactions_db}
    - TABLES_CONFIG_PATH=/opt/airflow/project/ingestion/src/tables_config.json
    # ── OpenLineage → GCP Dataplex Data Lineage API ───────────────────────────
    # Events are POSTed to the regional Dataplex processOpenLineageRunEvent
    # endpoint using Application Default Credentials (ADC) already mounted
    # at /home/airflow/.config/gcloud — no extra service account key needed.
    - AIRFLOW__OPENLINEAGE__DISABLED=true
    - OPENLINEAGE_NAMESPACE=ntt-e2e-pipeline
    - AIRFLOW__OPENLINEAGE__NAMESPACE=ntt-e2e-pipeline
    - AIRFLOW__OPENLINEAGE__DEBUG_MODE=true
    - _PIP_ADDITIONAL_REQUIREMENTS=dbt-bigquery pandas sqlalchemy psycopg2-binary google-cloud-bigquery google-cloud-bigquery-storage pyarrow db-dtypes pandas-gbq openlineage-python openlineage-dbt apache-airflow-providers-openlineage
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ~/.config/gcloud:/home/airflow/.config/gcloud:ro
    - .:/opt/airflow/project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres_airflow:
      condition: service_healthy
    postgres_source:
      condition: service_healthy
    postgres_source_seed:
      condition: service_completed_successfully

services:
  # Source PostgreSQL Database (simulating external transactions DB)
  postgres_source:
    image: postgres:15-alpine
    container_name: postgres_source
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-transactions_db}
    ports:
      - "5433:5432"
    volumes:
      - ./local_db/data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transactions_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot source seed job for local development
  postgres_source_seed:
    build:
      context: ./local_db
      dockerfile: seed.Dockerfile
    container_name: postgres_source_seed
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-transactions_db}
      POSTGRES_HOST: postgres_source
      POSTGRES_PORT: 5432
    depends_on:
      postgres_source:
        condition: service_healthy
    restart: "no"

  # Airflow Database
  postgres_airflow:
    image: postgres:15-alpine
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Airflow Init (runs database migrations and creates default admin user)
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username airflow \
          --firstname admin \
          --lastname admin \
          --role Admin \
          --email admin@example.com \
          --password airflow
    depends_on:
      postgres_airflow:
        condition: service_healthy
      postgres_source:
        condition: service_healthy
      postgres_source_seed:
        condition: service_completed_successfully

  # Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      postgres_airflow:
        condition: service_healthy
      postgres_source:
        condition: service_healthy
      postgres_source_seed:
        condition: service_completed_successfully
      airflow-init:
        condition: service_completed_successfully

  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      postgres_airflow:
        condition: service_healthy
      postgres_source:
        condition: service_healthy
      postgres_source_seed:
        condition: service_completed_successfully
      airflow-init:
        condition: service_completed_successfully
